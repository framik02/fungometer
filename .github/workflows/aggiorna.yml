# Aggiorna i punteggi ogni mattina e salva il risultato.
#
# Parte alle 4 e un quarto (ora italiana): con il meteo di tutta Italia il
# lavoro dura circa un'ora e un quarto, per stare sotto le 5.000 chiamate
# all'ora di Open-Meteo, e i dati nuovi sono pronti prima delle 6.
#
# GitHub fa partire i lavori programmati con molto ritardo (a ottobre 2026
# quelli delle 4:15 partivano verso le 11). Per questo il lavoro è programmato
# ogni ora dalle 22:17 alle 3:17 UTC (da mezzanotte alle 5 circa in Italia):
# con --controlla-ora lo script lavora solo se in Italia sono passate le 4 e
# oggi non l'ha ancora fatto, altrimenti esce in pochi secondi senza chiedere
# niente a Open-Meteo. Così basta che una partenza arrivi dopo le 4.
# Il minuto 17 evita il picco di carico all’inizio dell’ora su GitHub Actions.
# GitHub a volte avvia i cron con qualche decina di minuti di ritardo: è normale.
#
# Si può lanciare anche a mano: scheda Actions > Aggiorna punteggi > Run workflow.

name: Aggiorna punteggi

on:
  schedule:
    - cron: "17 22,23,0,1,2,3 * * *"
  workflow_dispatch:

# Serve per fare il commit del nuovo punteggi.json
permissions:
  contents: write

# Mai due aggiornamenti insieme
concurrency:
  group: aggiorna-punteggi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Mostra subito le stampe di Python nel log, invece che tutte alla fine
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7

      - name: Installa Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt pytest

      - name: Controlla il motore del punteggio (test)
        run: python -m pytest -q

      - name: Calcola i punteggi
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/aggiorna_punteggi.py --controlla-ora
          else
            python scripts/aggiorna_punteggi.py
          fi

      - name: Salva i punteggi nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Niente di nuovo da salvare."
            exit 0
          fi
          git commit -m "Punteggi del $(TZ=Europe/Rome date +%Y-%m-%d)"
          # Il lavoro dura più di un'ora: nel frattempo qualcuno può aver fatto
          # push. Ci si mette in coda ai suoi commit e si riprova (fino a 3 volte).
          for tentativo in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push rifiutato, riprovo fra 20 secondi"
            sleep 20
          done
          exit 1
