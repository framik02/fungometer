# Aggiorna i punteggi ogni mattina alle 6 (ora italiana) e salva il risultato.
#
# Il cron di GitHub usa l'ora UTC e non conosce l'ora legale:
#   04:00 UTC = 06:00 in Italia d'estate (CEST)
#   05:00 UTC = 06:00 in Italia d'inverno (CET)
# Quindi partiamo a entrambi gli orari e lo script, con --controlla-ora,
# lavora solo se in Italia sono passate le 6 e oggi non l'ha ancora fatto.
# GitHub a volte avvia i cron con qualche decina di minuti di ritardo: è normale.
#
# Si può lanciare anche a mano: scheda Actions > Aggiorna punteggi > Run workflow.

name: Aggiorna punteggi

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

# Serve per fare il commit del nuovo punteggi.json
permissions:
  contents: write

# Mai due aggiornamenti insieme
concurrency:
  group: aggiorna-punteggi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7

      - name: Installa Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le librerie
        run: pip install -r requirements.txt pytest

      - name: Controlla il motore del punteggio (test)
        run: python -m pytest -q

      - name: Calcola i punteggi
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/aggiorna_punteggi.py --controlla-ora
          else
            python scripts/aggiorna_punteggi.py
          fi

      - name: Salva i punteggi nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Niente di nuovo da salvare."
            exit 0
          fi
          git commit -m "Punteggi del $(TZ=Europe/Rome date +%Y-%m-%d)"
          git push
