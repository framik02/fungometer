name: Reindirizza il vecchio sito
on:
  push:
    branches: [main]
    paths: ['legacy-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: legacy-site
      - id: deployment
        uses: actions/deploy-pages@v4
