name: Diagnosi Open-Meteo (temporaneo)
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          L1="42.4"; O1="12.2"
          L10=$(python3 -c "print(','.join(str(42+i*0.03) for i in range(10)))"); O10=$(python3 -c "print(','.join(['12.2']*10))")
          L50=$(python3 -c "print(','.join(str(42+i*0.01) for i in range(50)))"); O50=$(python3 -c "print(','.join(['12.2']*50))")
          Q="daily=precipitation_sum,temperature_2m_max,temperature_2m_min,temperature_2m_mean,soil_moisture_0_to_7cm_mean&timezone=Europe%2FRome&past_days=17&forecast_days=8"
          for n in 1 10 50; do eval L=\$L$n; eval O=\$O$n
            curl -s -o /dev/null -m 120 -w "forecast $n loc: HTTP %{http_code} in %{time_total}s\n" "https://api.open-meteo.com/v1/forecast?latitude=$L&longitude=$O&$Q"
          done
          curl -s -o /dev/null -m 120 -w "forecast 1 loc solo pioggia: HTTP %{http_code} in %{time_total}s\n" "https://api.open-meteo.com/v1/forecast?latitude=42.4&longitude=12.2&daily=precipitation_sum&past_days=17&forecast_days=8"
          curl -s -o /dev/null -m 120 -w "forecast 10 loc senza suolo: HTTP %{http_code} in %{time_total}s\n" "https://api.open-meteo.com/v1/forecast?latitude=$L10&longitude=$O10&daily=precipitation_sum,temperature_2m_max,temperature_2m_min,temperature_2m_mean&timezone=Europe%2FRome&past_days=17&forecast_days=8"
          curl -s -m 20 "https://api.open-meteo.com/v1/forecast?latitude=42.4&longitude=12.2&daily=precipitation_sum" | head -c 300; echo
