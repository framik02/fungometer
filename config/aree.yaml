# Aree coperte da FungoMeter.
#
# Ogni area ha una sua griglia di celle quadrate da `lato_cella_km`.
# Dentro un'area ci sono una o più "zone": rettangoli in gradi decimali
# (sud/nord = latitudine, ovest/est = longitudine).
# Una cella entra nella mappa se il suo centro cade in almeno una zona.
# Le zone possono sovrapporsi: le celle in comune vengono contate una volta sola.
#
# Per aggiungere una zona basta copiare un blocco e cambiare i numeri.
# Le coordinate si leggono facilmente da openstreetmap.org (tasto destro, "Mostra indirizzo").

lato_cella_km: 3

